# deepseek-harness-humanity 的 bundle 补丁层。
#
# `dsh plugin --profile <profile> add <本包路径或包名>` 会把本包追加进该 profile 的
# `dsh.profile.bundles`（因为 package.json 声明了 `dsh.bundle.patch`），本补丁随后按该
# 顺序应用，早于 profile 自己的 cordis.patch.yml、home 补丁与任何 --patch 覆盖。
#
# 本行挂在宿主平面（全局），不进任何 agent preset 的 isolate realm：
#   - Humanity 工作台是一个全局页面，不属于某一个会话；
#   - 设置命名空间与存储领域是进程级共享状态，realm 会让同域的其他行看不见它。
#
# 这里刻意不写 `config:`。默认值的唯一真源是 `src/host/config.ts` 里的 Config schema；
# 在补丁里再抄一份默认值，只会在某次升级后与 schema 悄悄分叉（G-004 默认值不漂移）。
- insert:
    - id: humanity
      name: deepseek-harness-humanity

# 身份层（round 48d，真机反馈：双重身份声明把人格卡降格成"角色扮演"）：
# 关掉 DSH 第一方身份声明，让人格卡成为唯一自我认知。
#   - includeHarnessIdentity: false 摘掉全局 `harness:identity` 段
#     （"You are an AI agent powered by DeepSeek Harness."）；
#   - personaPrefix 置空：全局 deployment persona 前缀在渲染时落空；各 preset 自己的
#     前缀注册在 agent 作用域、配置够不着，由宿主身份层在 assemble waterfall 里按名摘除；
#   - personaSuffix 逐字保留：工作目录是**事实**不是身份。
# patch 替换目标行的**整个 config**，故三个键必须一起重述（与 dsh-web-app 补丁同方言）。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''
    personaSuffix: Your working directory is {{cwd}}.
